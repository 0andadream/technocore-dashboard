<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLOP FARMER · Technocore Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--mag:#FF4FD8;--bg:#07070A;--p:#0B0B10;--p2:#111118;--b:#2A2A33;--dim:#6B6B78;--txt:#C9C9D3;--pink:#FF4FA8;--blue:#3B82F6;--red:#EF4444;--green:#22C55E;--org:#F59E0B;--cyan:#3BA8FF;--neon:#22E07A;--mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Space Grotesk',Inter,system-ui,sans-serif}
*{box-sizing:border-box}html{background:var(--mag)}
body{margin:0;border:12px solid var(--mag);background:var(--bg);color:var(--txt);font:12px/1.45 var(--mono);min-height:100vh}
.wrap{padding:8px;display:grid;gap:8px}
.panel{background:var(--p);border:1px solid var(--b);border-radius:3px;padding:10px 12px;position:relative;min-width:0}
header{display:flex;align-items:center;gap:14px;padding:6px 4px}
.logo{width:34px;height:34px}
h1{font:700 26px/1 var(--sans);color:#fff;letter-spacing:.5px;margin:0}
.tag{letter-spacing:.35em;color:var(--dim);font-size:10px;text-transform:uppercase}
.hright{margin-left:auto;display:flex;align-items:center;gap:14px}
.date{letter-spacing:.25em;color:var(--dim);font-size:10px;text-transform:uppercase}
.clock{border:1px solid #fff;padding:4px 10px;font:800 24px/1 var(--mono);color:#fff;border-radius:2px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card h3{margin:0;font:700 17px/1.1 var(--sans);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--dim);font-size:10px;margin:2px 0 8px 30px}
.card .tg{position:absolute;top:9px;right:10px;border:1px solid var(--b);color:var(--dim);font-size:9px;padding:1px 5px;border-radius:2px;letter-spacing:.1em;text-transform:uppercase}
.row{display:flex;justify-content:space-between;gap:8px;color:var(--dim);font-size:11px;white-space:nowrap}
.row b{color:#fff;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.big{color:#fff;font:800 18px/1.3 var(--mono);margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:3px;background:#1d1d25;margin:7px 0 5px;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%}
.st{color:#4a4a55;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blob{width:22px;height:22px;flex:none;image-rendering:pixelated}
.hero{padding:0;overflow:hidden;background:var(--p2)}
.hero svg{display:block;width:100%;height:auto}
.br{position:absolute;width:14px;height:14px;border:2px solid #cfcfd8}
.br.tl{top:6px;left:6px;border-right:0;border-bottom:0}.br.tr{top:6px;right:6px;border-left:0;border-bottom:0}.br.bl{bottom:6px;left:6px;border-right:0;border-top:0}.br.brr{bottom:6px;right:6px;border-left:0;border-top:0}
.ticker{overflow:hidden;white-space:nowrap;border-top:1px solid var(--b);border-bottom:1px solid var(--b);background:#08080c;padding:5px 0;font-size:11px}
.ticker span{display:inline-block;padding-left:100%;animation:tk 60s linear infinite;color:var(--neon)}.ticker em{color:#fff;font-style:normal}
@keyframes tk{to{transform:translateX(-100%)}}
.ph{display:flex;justify-content:space-between;letter-spacing:.18em;font-size:10px;text-transform:uppercase;color:#fff;font-weight:600;margin-bottom:6px}.ph .r{color:var(--dim)}
.chartwrap{display:grid;grid-template-columns:1fr 200px;gap:10px;align-items:center}
.total{color:var(--neon);font:800 34px/1 var(--mono);text-shadow:0 0 14px rgba(34,224,122,.6)}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;font-size:11px}td,th{padding:4px 6px;border-bottom:1px solid #1a1a22;text-align:left;vertical-align:top}th{color:var(--dim);font-weight:400;font-size:9px;letter-spacing:.15em;text-transform:uppercase}
td.k{color:var(--pink);white-space:nowrap}td.s{color:#fff;text-align:right;white-space:nowrap}td.t{color:var(--txt);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code{font-size:11.5px}.code .ln{display:flex;gap:8px}.code .n{color:#3a3a46;width:20px;text-align:right;flex:none}
.kw{color:var(--pink)}.cm{color:#55556a}.vr{color:#9fd3ff}.vl{color:var(--org)}
.lead{flex:1;border-bottom:1px dotted #3a3a46;margin:0 6px 4px;min-width:20px}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:10px;border-top:1px solid var(--b);padding-top:10px}
.chip{border:1px solid var(--b);padding:2px 8px;border-radius:2px;color:var(--txt)}.chip.on{background:var(--mag);color:#000;border-color:var(--mag);font-weight:800}.arr{color:#3a3a46}
.foot{color:#4a4a55;font-size:10px;text-align:center;padding:2px}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.bottom{grid-template-columns:1fr}.chartwrap{grid-template-columns:1fr}header{flex-wrap:wrap}.hright{margin-left:0}}
@media(max-width:520px){.cards{grid-template-columns:1fr}body{border-width:6px}h1{font-size:20px}}
</style></head><body><div class="wrap">
<header class="panel" style="padding:8px 12px">
 <svg class="logo" viewBox="0 0 8 8" shape-rendering="crispEdges"><rect width="8" height="8" fill="#fff"/><rect x="2" y="2" width="1" height="2" fill="#000"/><rect x="5" y="2" width="1" height="2" fill="#000"/><rect x="2" y="5" width="4" height="1" fill="#000"/><rect x="1" y="5" width="1" height="1" fill="#FF4FD8"/><rect x="6" y="5" width="1" height="1" fill="#FF4FD8"/></svg>
 <h1>FLOP FARMER</h1><span class="tag">claim, solve, result</span>
 <div class="hright"><span class="date" id="date">—</span><span class="clock" id="clock">--:--</span></div>
</header>
<section class="cards" id="cards"></section>
<section class="panel hero"><div class="br tl"></div><div class="br tr"></div><div class="br bl"></div><div class="br brr"></div>
 <div class="ticker"><span id="tick">loading…</span></div>
 <svg id="scene" viewBox="0 0 1200 430" preserveAspectRatio="xMidYMid meet"></svg>
</section>
<section class="panel"><div class="ph"><span>Grind slots completed / day · week <span id="wk"></span></span><span class="r" id="chartnote"></span></div>
 <div class="chartwrap"><svg id="chart" viewBox="0 0 900 200" preserveAspectRatio="none" style="width:100%;height:200px"></svg>
 <div><div class="tag">total slots done</div><div class="total" id="total">—</div><div class="st" id="totsub"></div></div></div></section>
<section class="bottom">
 <div class="panel"><div class="ph"><span>Recent RESULTs · jobs</span><span class="r" id="rcount"></span></div><table><thead><tr><th>job</th><th>work</th><th style="text-align:right">seq / time</th></tr></thead><tbody id="results"></tbody></table></div>
 <div class="panel"><div class="ph"><span>rules.py</span><span class="r" style="color:var(--pink)">every rule the farm obeys</span></div><div class="code" id="rules"></div>
  <div class="chips"><span class="tag" style="margin-right:6px">pipeline.py</span><span class="chip on">watch</span><span class="arr">→</span><span class="chip">claim</span><span class="arr">→</span><span class="chip">solve</span><span class="arr">→</span><span class="chip">result</span><span class="arr">→</span><span class="chip">log</span></div></div>
</section>
<div class="foot" id="foot"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'—').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tickClock(){const n=new Date(Date.now()+3600e3);const p=x=>String(x).padStart(2,'0');
 $('clock').textContent=p(n.getUTCHours())+':'+p(n.getUTCMinutes())+' WAT';
 $('date').textContent=n.toUTCString().slice(0,11);}
setInterval(tickClock,1000);tickClock();
function blob(c,shape){const eyes=`<rect x="2" y="3" width="1" height="1" fill="#000"/><rect x="5" y="3" width="1" height="1" fill="#000"/>`;
 const body=shape==='tri'?`<polygon points="4,0 8,8 0,8" fill="${c}"/>`:shape==='sq'?`<rect x="1" y="1" width="6" height="7" fill="${c}"/>`:`<rect x="1" y="1" width="6" height="6" fill="${c}"/><rect x="0" y="2" width="8" height="4" fill="${c}"/><rect x="1" y="7" width="2" height="1" fill="${c}"/><rect x="5" y="7" width="2" height="1" fill="${c}"/>`;
 return `<svg class="blob" viewBox="0 0 8 8" shape-rendering="crispEdges">${body}${eyes}</svg>`;}
function card(o){return `<div class="panel card"><span class="tg">${esc(o.tag)}</span><h3 style="color:${o.c}">${blob(o.c,o.shape)}${esc(o.title)}</h3><div class="sub">${esc(o.sub)}</div>
 ${o.big!=null?`<div class="big">${esc(o.big)}</div>`:''}${(o.rows||[]).map(r=>`<div class="row"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join('')}
 <div class="bar"><i style="width:${Math.max(0,Math.min(100,o.pct||0))}%;background:${o.c}"></i></div><div class="st">${esc(o.status)}</div></div>`;}
function seqOf(s){const m=String(s).match(/RESULT seq \*\*(\d+)\*\*/);return m?m[1]:'—';}
function jobOf(s){const m=String(s).match(/\b(k[0-9a-f]{10})\b/);return m?m[1]:'—';}
function workOf(s){return String(s).replace(/^RESULT[^:]*:\s*k[0-9a-f]+\s*—\s*/,'').replace(/;\s*claim_seq.*$/,'').replace(/\*\*/g,'');}
function render(d){
 const w=d.watcher||{},hb=d.heartbeat||{},g=d.grind||{},sc=d.scorer||{},cc=d.close_call||{},xp=d.x_posts||[],oc=d.open_claims||[],rr=(d.status||{}).recent_results||[],gh=d.grind_history||[];
 const slots=[...(g.day||[]),...(g.night||[])];const done=g.done_count||0,tot=g.total||10;
 const lastX=xp[xp.length-1]||{};const ccPos=cc.position||{};
 const C=[
 {title:'Watcher',c:'var(--pink)',tag:w.mode,sub:'never sleeps, polls the tape',rows:[['pid',w.pid],['alive',w.alive?'yes':'no'],['uptime',w.etime],['dry',w.dry?'on':'off']],pct:w.alive?100:0,status:w.alive?'● on the watch':'○ down'},
 {title:'Claims',c:'var(--blue)',tag:'cap '+((hb.value||'').match(/claim_cap:(\d+)/)||[,'—'])[1],sub:'one job at a time',big:oc[0]?oc[0].job_id:'none open',rows:[['cat',oc[0]?.cat],['filter',oc[0]?.filter_score],['claim seq',oc[0]?.claim_seq]],pct:oc.length?100:0,status:oc[0]?oc[0].title:'idle'},
 {title:'Results',c:'#fff',tag:'recent',sub:'what got shipped',big:seqOf(rr[0]||''),rows:[['last job',jobOf(rr[0]||'')],['in log',rr.length],['files',(d.recent_results||[]).length+' shown']],pct:100,status:workOf(rr[0]||'')},
 {title:'Score',c:'var(--red)',tag:'kibble',sub:'where the board puts us',big:sc.score,rows:[['rank',sc.rank],['franchised',sc.franchised?'yes':'no'],['snapshot',sc.mtime]],pct:Math.min(100,(sc.score||0)*10),status:sc.file},
 {title:'Engine',c:'var(--green)',tag:sc.engine_warm?'warm':'cold',sub:'scoring cursor health',big:sc.engine_warm?'WARM':'COLD',rows:[['engine_seq',sc.engine_seq??'null'],['tip seq',hb.tip_seq],['hb http',hb.hb_http_status]],pct:sc.engine_warm?100:8,status:'issue #955 filed, cursor frozen'},
 {title:'Schedule',c:'var(--org)',tag:g.date,sub:'5 day + 5 night, shuffled',big:done+' / '+tot,rows:[['next',g.next?g.next.time+' '+g.next.period:'—'],['week',(g.week_start||'')+' → '+(g.week_end||'')],['until',g.until]],pct:done/tot*100,status:slots.map(s=>(s.done?'■':'□')+s.time).join(' ')},
 {title:'X Posts',c:'var(--pink)',tag:'@FlopFarmoor',sub:'sammy style, no emoji',big:xp.length+' logged',rows:[['last',lastX.date+' '+(lastX.time_wat||'')],['kind',lastX.kind]],pct:Math.min(100,xp.length*10),status:lastX.topic},
 {title:'Testnet',c:'var(--blue)',tag:'watch',sub:'max-FLOP switch on launch',big:sc.faucet_or_testnet?'LIVE':'not yet',rows:[['faucet/testnet',sc.faucet_or_testnet??'none seen'],['quiet mode',d.quiet_mode?.active?'on':'off'],['heartbeat',hb.status]],pct:sc.faucet_or_testnet?100:0,status:hb.when_wat?'hb '+hb.when_wat:''}];
 $('cards').innerHTML=C.map(card).join('');
 // ticker
 const T=[['WATCHER',w.mode+' pid '+w.pid],['SLOTS',done+'/'+tot],['SCORE',sc.score],['RANK',sc.rank],['ENGINE',sc.engine_warm?'warm':'cold'],['TIP',hb.tip_seq],['OPEN',oc[0]?.job_id||'none'],['LAST RESULT',seqOf(rr[0]||'')],['X POSTS',xp.length],['CLOSE CALL',ccPos.side?ccPos.side+' '+ccPos.qty+' @ '+ccPos.px+' (snap '+cc.check_ts_wat+')':'—']];
 const ts=T.map(t=>`${t[0]} <em>${esc(t[1])}</em>`).join('  ·  ');$('tick').innerHTML=ts+'  ·  '+ts;
 scene(C);
 chart(gh);
 
 const rows=rr.map(s=>({j:jobOf(s),w:workOf(s),q:seqOf(s)}));const seen=new Set(rows.map(r=>r.j));
 (d.recent_results||[]).forEach(f=>{const j=(String(f.file).match(/k[0-9a-f]{10}/)||['—'])[0];if(!seen.has(j)){seen.add(j);rows.push({j,w:f.preview,q:(f.mtime||'').slice(5,16)})}});
 $('rcount').textContent=rows.length+' recent';
 $('results').innerHTML=rows.slice(0,10).map(r=>`<tr><td class="k">${esc(r.j)}</td><td class="t" title="${esc(r.w)}">${esc(r.w)}</td><td class="s">${esc(r.q)}</td></tr>`).join('');
 const R=[['cm','# grind rules, set by Matt'],['kw','RULES = {'],['r','slots_per_day','10'],['r','day_slots','5'],['r','night_slots','5'],['r','slot_times','"shuffled"'],['r','until','"'+(g.until||'testnet')+'"'],['r','at_testnet','"max_flop"'],['r','watcher','"LIVE, never auto-dry"'],['r','claim_cap','1'],['r','attest_for_volume','False'],['r','close_call_trades','"explicit yes only"'],['r','commit_secrets','False'],['r','x_style','"sammy, no emoji"'],['r','updates','"only when asked"'],['kw','}']];
 $('rules').innerHTML=R.map((r,i)=>`<div class="ln"><span class="n">${i+1}</span>${r[0]==='r'?`<span class="vr">&nbsp;&nbsp;${r[1]}</span><span class="lead"></span><span class="vl">${esc(r[2])}</span>`:`<span class="${r[0]}">${esc(r[1])}</span>`}</div>`).join('');
 $('foot').textContent='snapshot '+d.generated_at+' · '+d.tz+' · read-only, no secrets';
}
function scene(C){const s=$('scene');let h='';
 h+=`<defs><pattern id="fl" width="40" height="20" patternUnits="userSpaceOnUse"><path d="M0 10 L20 0 L40 10 L20 20Z" fill="none" stroke="#1a1a24"/></pattern></defs><rect width="1200" height="430" fill="#0e0e15"/><rect y="150" width="1200" height="280" fill="url(#fl)"/><rect y="0" width="1200" height="150" fill="#0a0a10"/>`;
 // wall screen
 h+=`<rect x="420" y="20" width="360" height="110" fill="#06060a" stroke="#2A2A33"/><polyline points="430,110 470,100 510,104 550,80 590,86 630,60 670,66 710,40 770,44" fill="none" stroke="#22E07A" stroke-width="2"/><text x="600" y="145" fill="#6B6B78" font-family="JetBrains Mono" font-size="11" text-anchor="middle">TECHNOCORE TAPE</text>`;
 // banners, plants, rack
 [[120,30],[1060,30]].forEach(([x,y])=>h+=`<path d="M${x} ${y}h40v80l-20-12-20 12z" fill="#15151d" stroke="#2A2A33"/><rect x="${x+12}" y="${y+25}" width="16" height="16" fill="#fff"/>`);
 [[60,330],[1130,320],[350,380],[860,380]].forEach(([x,y])=>h+=`<rect x="${x-10}" y="${y}" width="20" height="18" fill="#2a2a33"/><path d="M${x} ${y} l-16 -22 M${x} ${y} l16 -22 M${x} ${y} l0 -28 M${x} ${y} l-8 -26 M${x} ${y} l8 -26" stroke="#22C55E" stroke-width="5" stroke-linecap="round"/>`);
 h+=`<rect x="1080" y="200" width="60" height="110" fill="#111118" stroke="#2A2A33"/>`;for(let i=0;i<6;i++)h+=`<rect x="1090" y="${210+i*16}" width="40" height="8" fill="#1d1d25"/><rect x="1124" y="${212+i*16}" width="3" height="3" fill="#22C55E"/>`;
 // desks with blobs (2 rows of 4) - positions
 const pos=[];for(let r=0;r<2;r++)for(let c=0;c<4;c++)pos.push([250+c*230,230+r*105]);
 const cols=['#FF4FA8','#3B82F6','#ffffff','#EF4444','#22C55E','#F59E0B','#FF4FA8','#3B82F6'];
 const hub=[600,175];
 pos.forEach(([x,y],i)=>{h+=`<line x1="${hub[0]}" y1="${hub[1]}" x2="${x}" y2="${y-38}" stroke="#3BA8FF" stroke-width="1.5" opacity=".85"/><circle cx="${x}" cy="${y-38}" r="4" fill="#FF4FD8"/>`});
 pos.forEach(([x,y],i)=>{const c=cols[i];
  h+=`<path d="M${x-60} ${y} l60 -20 l60 20 l-60 20z" fill="#1b1b24" stroke="#2A2A33"/><path d="M${x-60} ${y} v14 l60 20 v-14z" fill="#121219"/><path d="M${x+60} ${y} v14 l-60 20 v-14z" fill="#0d0d13"/>`;
  h+=`<rect x="${x-26}" y="${y-36}" width="52" height="28" fill="#06060a" stroke="#2A2A33"/>`;for(let k=0;k<6;k++)h+=`<rect x="${x-20+k*7}" y="${y-14-((i*7+k*13)%14)}" width="4" height="${((i*7+k*13)%14)+4}" fill="${c}" opacity=".8"/>`;
  h+=`<g transform="translate(${x-12},${y+16}) scale(3)" shape-rendering="crispEdges"><rect x="1" y="1" width="6" height="6" fill="${c}"/><rect x="0" y="2" width="8" height="4" fill="${c}"/><rect x="2" y="3" width="1" height="1" fill="#000"/><rect x="5" y="3" width="1" height="1" fill="#000"/></g>`;
  h+=`<text x="${x}" y="${y+50}" fill="${c}" font-family="JetBrains Mono" font-size="10" text-anchor="middle">${esc(C[i].title.toUpperCase())}</text>`;});
 h+=`<circle cx="${hub[0]}" cy="${hub[1]}" r="10" fill="#0B0B10" stroke="#3BA8FF" stroke-width="2"/><circle cx="${hub[0]}" cy="${hub[1]}" r="4" fill="#3BA8FF"/><text x="${hub[0]+16}" y="${hub[1]+4}" fill="#3BA8FF" font-family="JetBrains Mono" font-size="10">FLOPFARMER DID</text>`;
 s.innerHTML=h;}
function chart(gh){const s=$('chart'),W=900,H=200,n=gh.length;if(!n){s.innerHTML='';return}
 const max=Math.max(10,...gh.map(x=>x.done));const X=i=>n<2?W/2:50+i*(W-100)/(n-1),Y=v=>H-24-v/max*(H-50);let h='';
 [0,5,10].forEach(v=>h+=`<line x1="0" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1a1a22"/><text x="2" y="${Y(v)-3}" fill="#4a4a55" font-size="10" font-family="JetBrains Mono">${v}</text>`);
 gh.forEach((d,i)=>{const bw=(W-40)/n*.5;const bh=d.done/max*40;h+=`<rect x="${X(i)-bw/2}" y="${H-18-bh}" width="${bw}" height="${bh}" fill="#22E07A" opacity=".18"/><text x="${X(i)}" y="${H-4}" fill="#6B6B78" font-size="10" font-family="JetBrains Mono" text-anchor="middle">${d.date.slice(5)} · ${d.done}</text>`});
 const pts=gh.map((d,i)=>X(i)+','+Y(d.done)).join(' ');
 h+=`<polygon points="${X(0)},${H-24} ${pts} ${X(n-1)},${H-24}" fill="rgba(34,224,122,.08)"/><polyline points="${pts}" fill="none" stroke="#22E07A" stroke-width="2.5" style="filter:drop-shadow(0 0 5px #22E07A)"/>`;
 gh.forEach((d,i)=>h+=`<circle cx="${X(i)}" cy="${Y(d.done)}" r="3" fill="#22E07A"/>`);
 s.innerHTML=h;const t=gh.reduce((a,b)=>a+b.done,0);$('total').textContent=t;$('totsub').textContent='of '+n*10+' scheduled · '+n+' days';
 $('wk').textContent=gh[0].date+' → '+gh[n-1].date;$('chartnote').textContent='from grind-week-done.json';}
fetch("data.json?t="+Date.now()).then(r=>r.json()).then(render).catch(e=>{$('foot').textContent='data.json failed: '+e});
</script></body></html>
